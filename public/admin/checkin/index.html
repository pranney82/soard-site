<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#F5F4F0" />
  <meta name="color-scheme" content="light" />
  <title>SOARD Check-in</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- Saved to Clareece's home screen: SOARD's icon, named for the page -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Check-in" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./checkin.css" />
</head>
<body>
  <!-- Kid items check-in: scan a box (or tap the item), print its labels, put it on the kid's shelf (see ./checkin.js, /api/kid-items-admin) -->
  <div class="wrap">
    <header class="top">
      <div class="title-row"><div class="brand"><img class="logo" src="/cdn-cgi/imagedelivery/ROYFuPmfN2vPS6mt5sCkZQ/brand-logo-admin/w=128" alt="SOARD" width="42" height="42" /><h1>Check-in</h1></div><span class="chip-mode" id="mode" hidden>Practice</span></div>
      <label class="search" for="q">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Find an item, a kid or a store" autocomplete="off" enterkeyhint="search" />
      </label>
    </header>
    <div class="chips-bar"><div class="chips" id="chips" role="toolbar" aria-label="Show one kid"></div></div>
    <main id="list" aria-live="polite"><div class="hold"></div><div class="hold"></div></main>
  </div>
  <nav class="dock" aria-label="Check in">
    <div class="dock-in">
      <button class="btn btn-primary" id="scan" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.2"/></svg>
        Scan a box</button>
      <button class="btn btn-text" id="other" type="button">Something else</button>
    </div>
  </nav>
  <input id="camera" type="file" accept="image/*" capture="environment" hidden />
  <div id="sheet-root"></div>
  <script type="module" src="./checkin.js"></script>
</body>
</html>
