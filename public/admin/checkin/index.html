<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#F5F4F0" />
  <meta name="color-scheme" content="light" />
  <title>SOARD Check-in</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- Saved to Clareece's home screen: SOARD's icon, named for the page -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Check-in" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./checkin.css" />
</head>
<body>
  <!-- Kid items check-in: open the box, tap the item, print its labels (see ./checkin.js, /api/kid-items-admin?checkin=1) -->
  <div class="wrap">
    <header class="top">
      <div class="title-row"><h1>Check-in</h1><span class="pill" id="mode" hidden>Practice</span></div>
      <label class="search" for="q">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Find an item, a kid or a store" autocomplete="off" />
      </label>
      <div class="actions">
        <button class="btn" id="other" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Something else</button>
      </div>
      <div class="chips" id="chips" role="toolbar" aria-label="Show one kid"></div>
    </header>
    <p class="note" id="note" hidden></p>
    <main id="list"><p class="empty">Loading…</p></main>
  </div>
  <div id="sheet-root"></div>
  <script type="module" src="./checkin.js"></script>
</body>
</html>
