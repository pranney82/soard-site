<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light" />
  <title>SOARD Advisory Board</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="modulepreload" href="/admin/vendor.js" />
  <link rel="stylesheet" href="/admin/board/portal.css" />
  <!-- On a phone a part's name wraps rather than stops short -->
  <style>
    @media (max-width: 720px) {
      .bs-rail__row, .bs-rail__label { flex-wrap: wrap; min-width: 0; }
      .bs-rail__name, .bs-part__t, .bs-outline__t { white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: anywhere; display: block; -webkit-line-clamp: unset; }
      .bs-rail__name { display: inline; }
      .bs-rail__parts { flex-wrap: wrap; }
      .bs-rail__parts li { flex: 1 1 100%; min-width: 0; }
    }
  </style>
</head>
<body>
  <!-- An Advisory Board meeting on the screen, for whoever runs the group: the same screen the board's meetings use
       (../../board/screen.js), drawn from the meeting itself. ./page.js -->
  <div id="board-app"></div>
  <script type="module" src="./page.js"></script>
</body>
</html>
