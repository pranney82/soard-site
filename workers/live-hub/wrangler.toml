# soard-live-hub — deployed separately from the Pages project.
#   cd workers/live-hub && npx wrangler deploy
# No secrets: ticks are authenticated with one-time nonces verified over the Pages binding.
name = "soard-live-hub"
main = "src/index.js"
compatibility_date = "2026-09-01"
# No public URL: the site reaches the hub only through the LIVE_HUB binding
# (sockets via /api/live-ws, which checks the origin and the admin login)
workers_dev = false
preview_urls = false

[vars]
PAGES_ORIGIN = "https://sunshineonaranneyday.com"

[[durable_objects.bindings]]
name = "LIVE_HUB"
class_name = "LiveHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveHub"]

# The Office label printer (Zebra Cloud Connect): ./src/print-hub.js
[[durable_objects.bindings]]
name = "PRINT_HUB"
class_name = "PrintHub"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PrintHub"]
