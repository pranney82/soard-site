name = "soard"
compatibility_date = "2025-09-27"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[ai]
binding = "AI"

# D1 database — create with: wrangler d1 create soard-db
# Then paste the database_id below
[[d1_databases]]
binding = "DB"
database_name = "soard-db"
database_id = "71ac037d-2682-4336-9cf7-234e97c5b462"

# R2 bucket — create with: wrangler r2 bucket create soard-files
[[r2_buckets]]
binding = "FILES"
bucket_name = "soard-files"

# W-9s and certificates of insurance (functions/api/_vendor-files.js): a bucket
# of their own with no public address. Never soard-files, which
# files.sunshineonaranneyday.com serves to anyone who has a file's address.
[[r2_buckets]]
binding = "VENDOR_FILES"
bucket_name = "soard-vendor-docs"

# A real browser (Cloudflare Browser Rendering) for pages that turn the server
# away: Google answers plain requests from Workers with its "unusual traffic"
# page, and some news sites answer 403. Used by the press monitor
# (functions/api/_press-browser.js, with @cloudflare/puppeteer).
[browser]
binding = "BROWSER"

# ─── Preview / Staging ─────────────────────────────────────────────
# To isolate preview deployments (non-production branches) from prod data,
# create separate D1 + R2 resources and uncomment the section below:
#
#   wrangler d1 create soard-db-preview
#   wrangler d1 execute soard-db-preview --file=scripts/schema.sql
#   wrangler r2 bucket create soard-files-preview
#
# [env.preview]
# [[env.preview.d1_databases]]
# binding = "DB"
# database_name = "soard-db-preview"
# database_id = "your-preview-d1-id"
#
# [[env.preview.r2_buckets]]
# binding = "FILES"
# bucket_name = "soard-files-preview"

# Real-time hub for the live broadcast system. The Durable Object lives in the
# separate Worker under workers/live-hub (deployed with `wrangler deploy` there);
# Pages projects can only bind to a DO defined elsewhere.
[[durable_objects.bindings]]
name = "LIVE_HUB"
class_name = "LiveHub"
script_name = "soard-live-hub"

# The Office label printer's socket (Zebra Cloud Connect), in the same Worker
# (workers/live-hub/src/print-hub.js, deployed with it Nov 10 2026): /api/printer-ws/
# hands the printer to it, /api/kid-items-admin prints through it
[[durable_objects.bindings]]
name = "PRINT_HUB"
class_name = "PrintHub"
script_name = "soard-live-hub"
